<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="302" viewBox="0 0 1200 302" role="img" aria-label="build-system"><defs>
<linearGradient id="neon"><stop stop-color="#48eaff"/><stop offset=".5" stop-color="#9b6dff"/><stop offset="1" stop-color="#ff61cf"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#643dc4" stop-opacity=".45"/><stop offset="1" stop-color="#080b17" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8995cf" stroke-opacity=".07"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<style>
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.reverse{animation-direction:reverse;animation-duration:32s}
.float{animation:float 6s ease-in-out infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
.flow{stroke-dasharray:8 14;animation:flow 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes flow{to{stroke-dashoffset:-88}}
@media(prefers-reduced-motion:reduce){.spin,.float,.pulse,.flow{animation:none}}
