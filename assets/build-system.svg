 font-size="20" font-weight="700">03 / CONFIDENCE</text><text x="834" y="240" fill="#a9b1d0" font-family="Arial,Helvetica,sans-serif" font-size="16" >Pest · PHPUnit · TDD</text><path d="M923 132h214" stroke="#ff88d7" stroke-opacity=".5" class="flow"/></svg>